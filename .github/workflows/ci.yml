name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fork-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - run: echo "Sibling-dependent checks are skipped for fork pull requests because deploy keys are unavailable."
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: supa-release-gate-mcp
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fridaysundaymood/android-kit
          ssh-key: ${{ secrets.DEPLOY_KEY_ANDROID_KIT }}
          path: android-kit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fridaysundaymood/kit-fixture-app
          ssh-key: ${{ secrets.DEPLOY_KEY_KIT_FIXTURE_APP }}
          path: kit-fixture-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci --include-workspace-root --workspace=@budaknyenyel/kit-schema && npm run build --workspace=@budaknyenyel/kit-schema
        working-directory: android-kit
      - run: npm ci
        working-directory: supa-release-gate-mcp
      - run: npm run lint && npm run build && npm test
        working-directory: supa-release-gate-mcp
  local-supabase:
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: supa-release-gate-mcp
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fridaysundaymood/android-kit
          ssh-key: ${{ secrets.DEPLOY_KEY_ANDROID_KIT }}
          path: android-kit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fridaysundaymood/kit-fixture-app
          ssh-key: ${{ secrets.DEPLOY_KEY_KIT_FIXTURE_APP }}
          path: kit-fixture-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci --include-workspace-root --workspace=@budaknyenyel/kit-schema && npm run build --workspace=@budaknyenyel/kit-schema
        working-directory: android-kit
      - run: npm ci
        working-directory: supa-release-gate-mcp
      - run: node test/local-supabase.mjs
        working-directory: supa-release-gate-mcp
