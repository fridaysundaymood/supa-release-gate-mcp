name: CI
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: supa-release-gate-mcp
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/android-kit
          path: android-kit
          token: ${{ secrets.KIT_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/kit-fixture-app
          path: kit-fixture-app
          token: ${{ secrets.KIT_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: android-kit
      - run: npm ci
        working-directory: supa-release-gate-mcp
      - run: npm run lint && npm run build && npm test
        working-directory: supa-release-gate-mcp
  local-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: supa-release-gate-mcp
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/android-kit
          path: android-kit
          token: ${{ secrets.KIT_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/kit-fixture-app
          path: kit-fixture-app
          token: ${{ secrets.KIT_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: android-kit
      - run: npm ci
        working-directory: supa-release-gate-mcp
      - run: node test/local-supabase.mjs
        working-directory: supa-release-gate-mcp
